# No-card fallback under evaluation. Keep the workspace without a payment method.
# Render otherwise bills bandwidth/build overages even for Free web services.
services:
  - type: web
    name: keyline-rental-inventory
    runtime: node
    plan: free
    region: singapore
    branch: chore/free-production-infrastructure
    autoDeployTrigger: commit
    buildCommand: npx --yes pnpm@11.25.0 install --frozen-lockfile && npx --yes pnpm@11.25.0 build
    startCommand: node node_modules/next/dist/bin/next start --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_USE_FIREBASE_EMULATORS
        value: "false"
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: IMAGEKIT_URL_ENDPOINT
        sync: false
